name: Org Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Generic org-wide review instructions.
          # Claude will also read any CLAUDE.md/REVIEW.md in the specific repo.
          prompt: |
            You are the code review assistant for the Veluvo Softwares GitHub organization.
            Review this pull request for:
            - correctness and potential bugs
            - security issues and data leaks
            - performance regressions
            - API and contract changes that might break other services
            - readability and maintainability, but keep style nits minimal
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Test coverage
           
            Be constructive and helpful in your feedback.


            Focus on the diff and post:
            - inline comments on specific issues
            - a concise summary in the review body.
          claude_args: |
            --max-turns 6
            --model claude-sonnet-4-6
