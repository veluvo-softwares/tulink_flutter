# iOS production (App Store) scaffold — NOT yet implemented.
#
# Android production is NOT here: it lives in android-release.yml, which
# promotes an existing closed-testing build to the production track. This file
# is kept only so the iOS App Store lane has somewhere to land when it is built.
#
# Manual dispatch runs the `guard` job, which only prints an explanation and
# exits 0. The `ios-production` job below is gated behind the
# IOS_PRODUCTION_ENABLED repo variable and never runs while it is unset, so
# nothing here can publish. Set that variable only AFTER replacing the
# placeholder step with a real production lane.
name: Production · App Store (iOS)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: iOS production not yet wired
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "iOS production releases are not yet implemented."
          echo "Android production is handled by android-release.yml"
          echo "(mode: promote — promotes a closed-testing build to production)."
          echo ""
          echo "To implement iOS production:"
          echo "  1. Add a production lane to ios/fastlane/Fastfile using deliver,"
          echo "     reusing the signing setup from alpha-ios.yml."
          echo "  2. Replace the placeholder step in the ios-production job."
          echo "  3. Only then set the IOS_PRODUCTION_ENABLED repo variable to 'true'."
          exit 0

  ios-production:
    name: iOS · App Store
    needs: guard
    # Gate: set the IOS_PRODUCTION_ENABLED repo variable to "true" once the
    # iOS production lane exists. Unset means this job never runs.
    if: vars.IOS_PRODUCTION_ENABLED == 'true'
    runs-on: macos-latest
    environment: production
    steps:
      - name: Placeholder
        run: |
          echo "TODO: build signed IPA and run fastlane ios production"
