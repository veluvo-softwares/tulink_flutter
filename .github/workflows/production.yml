name: Production · App Stores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this version"
        required: false
        type: string
      target_track:
        description: "Play Store / App Store track (internal, alpha, beta, production)"
        required: false
        default: "internal"
        type: string
      rollout_percentage:
        description: "Staged rollout percentage (1-100)"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Production not yet wired
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "Production releases are not yet implemented."
          echo "This workflow is scaffolding for a future PR that will:"
          echo "  - Android: ship to Play Store internal track via fastlane supply"
          echo "  - iOS: ship to App Store Connect via fastlane deliver/pilot"
          echo "Remove the 'if: false' gates on the jobs below and fill in"
          echo "the production lanes in android/fastlane/Fastfile and"
          echo "ios/fastlane/Fastfile when ready."
          exit 0

  android-production:
    name: Android · Play Store
    needs: guard
    if: false # gate — flip to true when prod lane is implemented
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Placeholder
        run: |
          echo "TODO: build AAB and run fastlane android production"

  ios-production:
    name: iOS · App Store
    needs: guard
    if: false # gate — flip to true when prod lane is implemented
    runs-on: macos-latest
    environment: production
    steps:
      - name: Placeholder
        run: |
          echo "TODO: build signed IPA and run fastlane ios production"
